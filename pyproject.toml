[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "random-erasing-repro"
version = "0.1.0"
description = "Evidence-tracked reproduction of Random Erasing Data Augmentation"
requires-python = ">=3.10"
dependencies = [
  "torch==2.12.1",
  "torchvision==0.27.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

