[experiment]
name = "cifar100_resnet32_baseline"
seeds = [1001, 1002, 1003, 1004, 1005]

[dataset]
name = "cifar100"
root = "data"
download = true

[model]
architecture = "resnet"
depth = 32

[training]
epochs = 300
train_batch_size = 128
test_batch_size = 100
learning_rate = 0.1
milestones = [150, 225]
gamma = 0.1
momentum = 0.9
weight_decay = 0.0005
workers = 4

[augmentation]
random_crop = true
crop_size = 32
padding = 4
horizontal_flip = true

[erasing]
mode = "off"
probability = 0.0
min_area = 0.02
max_area = 0.4
min_aspect = 0.3
trials = 100

[runtime]
deterministic = true
output_root = "runs"
