[experiment]
name = "cifar10_resnet20_re_paper"
# [PROJECT] The paper reports five runs but does not publish their seeds.
seeds = [1001, 1002, 1003, 1004, 1005]

[dataset]
name = "cifar10"
root = "data"
download = true

[model]
architecture = "resnet"
depth = 20

[training]
epochs = 300
train_batch_size = 128
test_batch_size = 100
learning_rate = 0.1
milestones = [150, 225]
gamma = 0.1
momentum = 0.9
weight_decay = 0.0005
workers = 4

[augmentation]
random_crop = true
crop_size = 32
padding = 4
horizontal_flip = true

[erasing]
# [PAPER] Independent random values are written before normalization.
mode = "paper_random"
probability = 0.5
min_area = 0.02
max_area = 0.4
min_aspect = 0.3
trials = 100

[runtime]
# [PROJECT] Deterministic mode is added for auditability; the author code used cudnn.benchmark=true.
deterministic = true
output_root = "runs"

